<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Team – Chia nhóm ngẫu nhiên</title>
<style>
:root{--ink:#1d2a44;--soft:#5b6b8c;--line:#d9e2f2;--blue:#2f80ed;--green:#2e9e5b;--red:#e53935;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:18px/1.45 "Segoe UI","Be Vietnam Pro",Roboto,system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(160deg,#dff3ff 0%,#efe6ff 55%,#ffe9f1 100%);background-attachment:fixed}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 16px;padding:8px 18px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:22px;white-space:nowrap}
.hinfo{font-size:14px;color:var(--soft);padding-left:14px;border-left:2px solid var(--line);min-width:0}
.sp{flex:1}
header .gear{margin-left:auto}
@media (max-width:900px){.ctlb{position:static;transform:none}}
.ctlb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.clb{padding:0 12px;font-weight:700;font-size:16px;white-space:nowrap}
input#gcount{width:64px;text-align:center;font-size:20px;padding:6px 4px;border:0;border-left:2px solid var(--line);border-radius:0;max-width:none}
.ctlb .btn{margin:0;border-radius:0;box-shadow:none;font-size:17px;padding:9px 20px}
.ctlb .btn:active{transform:none;box-shadow:none;background:#1f5fb8}
.err{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin:6px 0 0;background:#fff;border:2px solid var(--red);border-radius:10px;padding:6px 14px;color:var(--red);font-weight:700;font-size:15px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.gear{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;line-height:1;padding:0}
.gear:hover{background:#f1f6ff}.gear:disabled{opacity:.4;cursor:default}
main{max-width:1500px;margin:0 auto;padding:14px 18px 80px}
input[type=text]{font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;border:3px solid var(--line);color:var(--ink);background:#fff}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.btn{border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:22px;padding:12px 30px;box-shadow:0 5px 0 #1f5fb8;margin-left:14px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f5fb8}.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;font-size:15px;padding:0}
#groups{--mfs:19px;display:grid;grid-template-columns:repeat(auto-fill,minmax(max(230px,calc(var(--mfs)*12)),1fr));gap:16px;align-items:start}
.grp{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(60,80,140,.14);overflow:hidden;border:2px solid var(--line)}
.gh{position:relative;background:var(--bg);padding:22px 0 8px 10px}
.gtop{display:flex;align-items:center;gap:8px}
.gn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--fg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
input.gname{flex:1;min-width:0;width:100%;max-width:none;font-size:calc(var(--mfs,19px)*.9);padding:5px 8px;border-width:2px;border-right:0;border-radius:9px 0 0 9px}
.gc{position:absolute;top:3px;right:9px;color:#000;font-size:14px;font-weight:600;line-height:1}
input.gnote{display:block;max-width:none;width:100%;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:#fffbe6;font-size:calc(var(--mfs,19px)*.8);padding:6px 12px;font-weight:600}
input.gnote:focus{border-color:#f5c542;background:#fff8cc}
.glist{list-style:none;margin:0;padding:0;min-height:44px}
.glist.over{background:#f1f6ff;box-shadow:inset 0 0 0 2px var(--blue)}
.mem{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:var(--mfs,19px);font-weight:600;user-select:none;cursor:grab;min-height:calc(var(--mfs,19px)*2.2)}
.mem .grip{flex:none;width:12px;height:18px;background:radial-gradient(circle,#b9c6e0 1.6px,transparent 1.8px) 0 0/6px 6px;touch-action:none}
.mem .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem.ph .mn{visibility:hidden}.mem.spin .mn{color:#8c97b0}.mem.pop{animation:pop .45s}
.mem.dragging{opacity:.35}
.ghost{position:fixed;z-index:200;pointer-events:none;background:#fff;border:2px solid var(--blue);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(2deg)}
@keyframes pop{0%{background:#c8f3e0;transform:scale(1.06)}100%{background:transparent;transform:none}}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:50}
.chip{position:absolute;padding:4px 14px;border-radius:999px;background:#e6f1fb;color:#0c447c;font-weight:700;font-size:18px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip.card{border-radius:8px;background:#fff;border:1.5px solid #b9c6e0;color:var(--ink);padding:6px 14px}
.chip.ball{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:17px}
.chip.fl{animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -9px}}
#drum{position:absolute;top:74px;left:50%;width:360px;height:180px;margin-left:-180px;border:3px dashed #8c97b0;border-radius:24px;background:rgba(255,255,255,.7);display:none}
#drum span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:13px;color:var(--soft)}
#skip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:none;border:0;border-radius:999px;background:#1d2a44;color:#fff;font-weight:700;padding:10px 24px;font-size:16px;opacity:.9}
.hint{text-align:center;color:var(--soft);font-size:15px;margin:0 0 14px}
.modal{position:fixed;inset:0;background:rgba(15,25,50,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h2{margin:0 0 16px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.box h2 button{border:0;background:none;font-size:24px;color:var(--soft)}
.fld{margin-bottom:16px}.fld>label{display:block;font-size:15px;color:var(--soft);margin-bottom:6px;font-weight:600}
select{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.note{margin:6px 0 0;font-size:13px;color:#7a86a3}
.chk{display:flex;align-items:center;gap:10px;padding:12px;background:#f3f6fc;border-radius:10px;font-size:17px;margin-bottom:20px}
.chk input{width:20px;height:20px}
.acts{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.acts button{border-radius:10px;padding:8px 20px;border:2px solid var(--line);background:#fff;font-weight:600}
.acts .ok{background:var(--ink);color:#fff;border-color:var(--ink)}
#cv{position:fixed;inset:0;pointer-events:none;z-index:150}
</style>
</head>
<body>
<header>
  <h1>Random Team</h1>
  <div class="hinfo"><span id="info">Đang đọc randomlist.csv…</span>
    <span id="picker" style="display:none"><button class="lnk" id="pick">Chọn file randomlist.csv</button><input type="file" id="file" accept=".csv,text/csv,text/plain" style="display:none"></span></div>
  <div class="ctlb"><span class="clb">Số nhóm</span><input type="text" id="gcount" inputmode="numeric" value="6" maxlength="3" aria-label="Số lượng nhóm"><button class="btn" id="go">Chia nhóm</button></div>
  <button class="gear" id="gear" aria-label="Thiết lập" title="Thiết lập">⚙️</button>
  <p class="err" id="err"></p>
</header>
<main>
  <p class="hint" id="hint" style="display:none">Bấm vào ô tên nhóm để sửa. Kéo tên thành viên để đổi thứ tự hoặc chuyển sang nhóm khác.</p>
  <div id="groups"></div>
</main>

<div class="modal" id="modal">
  <div class="box" role="dialog" aria-label="Thiết lập">
    <h2><span>⚙️ Thiết lập</span><button id="x" aria-label="Đóng">✕</button></h2>
    <div class="fld"><label for="fx">Kiểu hiệu ứng</label>
      <select id="fx"><option value="0">1. Chia bài</option><option value="1">2. Máy quay số</option><option value="2">3. Lồng quay xổ số</option><option value="3">4. Nam châm</option><option value="4">5. Giải mã ma trận</option></select></div>
    <div class="fld"><label for="sex">Cách chia theo giới tính</label>
      <select id="sex"><option value="sep">Nam nữ riêng</option><option value="mix">Nam nữ chung</option></select></div>
    <div class="fld"><label for="secs">Thời gian hiệu ứng</label>
      <input type="text" id="secs" inputmode="numeric" style="width:90px;text-align:center" maxlength="3"> <span style="color:var(--soft)">giây</span></div>
    <div class="fld"><label for="fs">Cỡ chữ trong bảng nhóm</label>
      <select id="fs"><option value="0">Rất nhỏ</option><option value="1">Nhỏ</option><option value="2">Vừa</option><option value="3">Lớn</option></select></div>
    <label class="chk"><input type="checkbox" id="flt">Lọc thành viên</label>
    <div class="acts"><button id="cancel">Đóng</button><button class="ok" id="save">Lưu</button></div>
  </div>
</div>
<div id="fxl"><div id="drum"><span>Lồng quay</span></div></div>
<button id="skip">Bỏ qua hiệu ứng ▶▶</button>
<canvas id="cv"></canvas>

<script>
const $ = (s, r = document) => r.querySelector(s);
const S = { sex: "sep", secs: 15, filter: false, fx: 1, fs: 2 };
const FS = [13, 16, 19, 24];
const applyFs = () => $("#groups").style.setProperty("--mfs", FS[S.fs] + "px");
try { Object.assign(S, JSON.parse(localStorage.getItem("rt_settings2") || "null") || {}); } catch (e) {}
const saveSet = () => { try { localStorage.setItem("rt_settings2", JSON.stringify(S)); } catch (e) {} };

applyFs();
/* ===== ĐỌC CSV ===== */
const noDia = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim();
function gender(s) { const g = noDia(s); if (/^(nam|m|male|trai|boy)$/.test(g)) return "M"; if (/^(nu|f|female|gai|girl)$/.test(g)) return "F"; return "?"; }
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0];
  const cnt = d => first.split(d).length;
  const delim = [",", ";", "\t"].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function toStudents(rows) {
  if (rows.length) {
    const r = rows[0], g2 = (r[1] || "").trim(), g3 = (r[2] || "").trim();
    if ((g2 || g3) && gender(g2) === "?" && !/^\d+$/.test(g3)) rows = rows.slice(1);
  }
  return rows.map(r => ({ name: (r[0] || "").trim(), g: gender(r[1]), k: (r[2] || "").trim() })).filter(s => s.name);
}
let STU = [];
function setStudents(rows) {
  STU = toStudents(rows);
  const m = STU.filter(s => s.g === "M").length, f = STU.filter(s => s.g === "F").length;
  $("#info").innerHTML = STU.length ? `<b>${STU.length}</b> người (${m} nam, ${f} nữ) · <button class="lnk" id="pick2">Đổi file</button>` : "File không có tên nào. Kiểm tra cột 1 (tên). ";
  $("#picker").style.display = STU.length ? "none" : "inline";
  const p2 = $("#pick2"); if (p2) p2.onclick = () => $("#file").click();
}
function loadFile(f) { const rd = new FileReader(); rd.onload = () => setStudents(parseCSV(rd.result)); rd.readAsText(f, "utf-8"); }
fetch("randomlist.csv", { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.text(); }).then(t => setStudents(parseCSV(t)))
  .catch(() => { $("#info").textContent = "Chưa tự đọc được randomlist.csv. "; $("#picker").style.display = "inline"; });
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ""; };

/* ===== CHIA NHÓM ===== */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function divide(stu, G) {
  const groups = Array.from({ length: G }, () => []);
  if (!S.filter) {
    const buckets = S.sex === "sep" ? [stu.filter(s => s.g === "M"), stu.filter(s => s.g === "F"), stu.filter(s => s.g === "?")] : [stu];
    const order = shuffle([...Array(G).keys()]); let p = 0;
    buckets.forEach(b => shuffle(b.slice()).forEach(s => { groups[order[p % G]].push(s); p++; }));
  } else {
    const map = new Map(), items = [];
    stu.forEach(s => {
      if (s.k) { if (!map.has(s.k)) { const it = { m: [] }; map.set(s.k, it); items.push(it); } map.get(s.k).m.push(s); }
      else items.push({ m: [s] });
    });
    shuffle(items); items.sort((a, b) => b.m.length - a.m.length);
    items.forEach(it => {
      const im = it.m.filter(s => s.g === "M").length, iF = it.m.filter(s => s.g === "F").length;
      let best = [], bs = Infinity;
      groups.forEach((g, i) => {
        let sc = g.length * 1000;
        if (S.sex === "sep") sc += g.filter(s => s.g === (im >= iF ? "M" : "F")).length;
        if (sc < bs) { bs = sc; best = [i]; } else if (sc === bs) best.push(i);
      });
      groups[best[Math.floor(Math.random() * best.length)]].push(...it.m);
    });
  }
  groups.forEach(g => shuffle(g));
  return groups;
}

/* ===== VẼ BẢNG NHÓM ===== */
const BG = ["#e6f1fb", "#eaf3de", "#faeeda", "#fbeaf0", "#eeedfe", "#e1f5ee", "#faece7", "#f1efe8"];
const FG = ["#185fa5", "#3b6d11", "#854f0b", "#993556", "#534ab7", "#0f6e56", "#993c1d", "#5f5e5a"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function renderGroups(groups) {
  const w = $("#groups"); w.innerHTML = "";
  groups.forEach((g, i) => {
    const d = document.createElement("div"); d.className = "grp"; d.style.setProperty("--bg", BG[i % 8]); d.style.setProperty("--fg", FG[i % 8]);
    d.innerHTML = `<div class="gh"><span class="gc" title="Số thành viên">${g.length}</span><div class="gtop"><span class="gn">${i + 1}</span><input type="text" class="gname" placeholder="Tên nhóm" maxlength="30" aria-label="Tên nhóm ${i + 1}"></div></div>
      <input type="text" class="gnote" placeholder="Ghi chú (điểm, nhận xét...)" maxlength="80" aria-label="Ghi chú nhóm ${i + 1}">
      <ul class="glist">${g.map(s => `<li class="mem" data-name="${esc(s.name)}"><span class="grip"></span><span class="mn">${esc(s.name)}</span></li>`).join("")}</ul>`;
    w.appendChild(d);
  });
  w.querySelectorAll(".gname,.gnote").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); }));
}
const updCounts = () => document.querySelectorAll(".grp").forEach(g => { $(".gc", g).textContent = g.querySelectorAll(".mem").length; });

/* ===== ÂM THANH + PHÁO GIẤY ===== */
let AC = null, lastTick = 0;
function tone(f, d = 0.07, v = 0.05) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = "triangle"; g.gain.value = v;
    o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function tick() { const n = performance.now(); if (n - lastTick < 45) return; lastTick = n; tone(700 + Math.random() * 300); }
function chime() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.25, 0.07), i * 130)); }
function confetti() {
  const cv = $("#cv"), c = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ff7043", "#ffb300", "#66bb6a", "#42a5f5", "#ab47bc", "#ef5350"];
  const P = Array.from({ length: 170 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * 6)], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t) {
    c.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += 0.1; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); c.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else c.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

/* ===== HIỆU ỨNG ===== */
const fxl = $("#fxl"), drum = $("#drum");
let R = null; /* trạng thái hiệu ứng đang chạy */
function reveal(li) { li.classList.remove("ph", "spin"); $(".mn", li).textContent = li.dataset.name; li.classList.add("pop"); }
function chip(txt, x, y, cls) { const c = document.createElement("div"); c.className = "chip " + (cls || ""); c.textContent = txt; c.style.left = x + "px"; c.style.top = y + "px"; fxl.appendChild(c); return c; }
function fly(el, li, dur, mid, rot) {
  const r = li.getBoundingClientRect(), sx = parseFloat(el.style.left), sy = parseFloat(el.style.top);
  const dx = r.left + 24 - sx, dy = r.top + (r.height - el.offsetHeight) / 2 - sy;
  el.classList.remove("fl");
  const a = el.animate([{ transform: "translate(0,0) rotate(0deg)" }, { transform: `translate(${dx * 0.5}px,${dy * 0.5 + mid}px) rotate(${rot}deg)` }, { transform: `translate(${dx}px,${dy}px) rotate(0deg)` }], { duration: dur, easing: "ease-in-out", fill: "both" });
  a.onfinish = () => { reveal(li); el.remove(); tick(); };
  R.anims.push(a);
}
const at = (ms, f) => R.timers.push(setTimeout(f, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const GL = "01#%$@ABCDEFXYZ<>/";

function runFx(kind, T, done) {
  const lis = [...document.querySelectorAll(".mem")], N = lis.length;
  const rows = [...document.querySelectorAll(".glist")].map(l => [...l.children]), maxR = Math.max(...rows.map(r => r.length));
  const rr = []; for (let r = 0; r < maxR; r++) rows.forEach(g => { if (g[r]) rr.push(g[r]); });
  const names = STU.map(s => s.name);
  R = { timers: [], anims: [], raf: 0, done };
  lis.forEach(l => l.classList.add("ph"));
  $("#skip").style.display = "block";
  const W = innerWidth, H = innerHeight, sp = n => (n <= 1 ? 0 : 1 / (n - 1));
  if (kind === 0) {
    const dur = clamp(T * 0.06, 350, 800), t0 = T * 0.05, step = Math.max(30, (T * 0.92 - t0 - dur) * sp(N));
    rr.forEach((li, i) => { const c = chip(li.dataset.name, W / 2 - 50, 90, "card"); c.style.zIndex = 500 - i; at(t0 + i * step, () => fly(c, li, dur, -50, i % 2 ? 9 : -9)); });
  }
  if (kind === 1) {
    lis.forEach(l => { l.classList.remove("ph"); l.classList.add("spin"); });
    R.timers.push(setInterval(() => lis.forEach(l => { if (l.classList.contains("spin")) $(".mn", l).textContent = names[Math.floor(Math.random() * names.length)]; }), 70));
    lis.forEach((li, i) => at(T * 0.3 + T * 0.65 * i * sp(N), () => { reveal(li); tick(); }));
  }
  if (kind === 2) {
    drum.style.display = "block"; const dw = 360, dh = 180, L = W / 2 - dw / 2, TOP = 74, balls = [];
    const pal = [["#e6f1fb", "#0c447c"], ["#eaf3de", "#27500a"], ["#faeeda", "#633806"], ["#fbeaf0", "#72243e"]];
    rr.forEach((li, i) => {
      const c = chip(li.dataset.name.split(" ").pop().charAt(0), L + rnd(10, dw - 50), TOP + rnd(10, dh - 50), "ball"); c.style.background = pal[i % 4][0]; c.style.color = pal[i % 4][1];
      balls.push({ e: c, li, x: parseFloat(c.style.left), y: parseFloat(c.style.top), vx: (Math.random() < 0.5 ? -1 : 1) * rnd(2, 5), vy: (Math.random() < 0.5 ? -1 : 1) * rnd(2, 5) });
    });
    const tEnd = performance.now() + T * 0.3;
    (function step() {
      balls.forEach(o => { if (!o.e.isConnected) return; o.x += o.vx; o.y += o.vy; if (o.x < L + 4 || o.x > L + dw - 40) o.vx *= -1; if (o.y < TOP + 4 || o.y > TOP + dh - 40) o.vy *= -1; o.e.style.left = o.x + "px"; o.e.style.top = o.y + "px"; });
      if (performance.now() < tEnd) R.raf = requestAnimationFrame(step);
    })();
    const dur = clamp(T * 0.07, 400, 900), gap = Math.max(30, (T * 0.9 - T * 0.3 - dur) * sp(N));
    balls.forEach((o, i) => at(T * 0.3 + i * gap, () => fly(o.e, o.li, dur, -30, 0)));
    at(T * 0.3 + N * gap + 200, () => { drum.style.display = "none"; });
  }
  if (kind === 3) {
    const dur = clamp(T * 0.1, 500, 1100), gap = Math.max(30, (T * 0.92 - T * 0.25 - dur) * sp(N));
    rr.forEach((li, i) => { const c = chip(li.dataset.name, rnd(20, W - 160), rnd(80, H - 80), "fl"); c.style.animationDelay = -Math.random() + "s"; at(T * 0.25 + i * gap, () => fly(c, li, dur, -90, 0)); });
  }
  if (kind === 4) {
    const t0 = performance.now(), st = lis.map((li, i) => T * 0.15 + T * 0.7 * i * sp(N)), done5 = new Array(N).fill(false);
    lis.forEach(l => { l.classList.remove("ph"); l.classList.add("spin"); });
    R.timers.push(setInterval(() => {
      const t = performance.now() - t0;
      lis.forEach((li, j) => {
        if (done5[j]) return;
        const n = li.dataset.name, q = clamp(Math.floor((t - st[j]) / 90), 0, n.length);
        let o = n.slice(0, q); for (let m = q; m < n.length; m++) o += n[m] === " " ? " " : GL[Math.floor(Math.random() * GL.length)];
        $(".mn", li).textContent = o;
        if (q >= n.length) { done5[j] = true; reveal(li); tick(); }
      });
    }, 50));
  }
  at(T + 600, finishFx);
}
function finishFx(skip) {
  if (!R) return;
  const r = R; R = null;
  r.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); cancelAnimationFrame(r.raf); r.anims.forEach(a => { a.onfinish = null; a.cancel(); });
  fxl.querySelectorAll(".chip").forEach(c => c.remove()); drum.style.display = "none";
  document.querySelectorAll(".mem").forEach(l => { if (l.classList.contains("ph") || l.classList.contains("spin")) reveal(l); });
  $("#skip").style.display = "none"; confetti(); chime(); r.done();
}
$("#skip").onclick = () => finishFx(true);

/* ===== NÚT BẮT ĐẦU ===== */
function setBusy(b) { $("#go").disabled = b; $("#gear").disabled = b; $("#gcount").disabled = b; }
$("#go").onclick = () => {
  const err = $("#err"); err.style.display = "none";
  const fail = m => { err.textContent = m; err.style.display = "block"; clearTimeout(fail.t); fail.t = setTimeout(() => { err.style.display = "none"; }, 5000); };
  if (!STU.length) { fail("Chưa có danh sách. Hãy chọn file randomlist.csv."); return; }
  const G = parseInt($("#gcount").value, 10);
  if (!G || G < 1) { fail("Nhập số lượng nhóm (từ 1 trở lên)."); return; }
  if (G > STU.length) { fail(`Số nhóm lớn hơn số người (${STU.length}). Hãy nhập số nhỏ hơn.`); return; }
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume && AC.resume(); } catch (e) {}
  renderGroups(divide(STU, G)); $("#hint").style.display = "block"; setBusy(true);
  const first = $("#groups").firstElementChild; if (first) first.scrollIntoView({ block: "nearest" });
  runFx(S.fx, Math.max(1, S.secs) * 1000, () => setBusy(false));
};
$("#gcount").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });

/* ===== KÉO THẢ THÀNH VIÊN (chuột và cảm ứng) ===== */
let drag = null;
document.addEventListener("pointerdown", e => {
  const li = e.target.closest(".mem"); if (!li || R) return;
  if (e.pointerType === "touch" && !e.target.closest(".grip")) return;
  drag = { li, x: e.clientX, y: e.clientY, on: false };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
    drag.on = true; const r = drag.li.getBoundingClientRect(); drag.ox = e.clientX - r.left; drag.oy = e.clientY - r.top;
    const g = drag.li.cloneNode(true); g.classList.add("ghost"); g.style.width = r.width + "px"; document.body.appendChild(g); drag.g = g; drag.li.classList.add("dragging");
  }
  e.preventDefault();
  drag.g.style.left = e.clientX - drag.ox + "px"; drag.g.style.top = e.clientY - drag.oy + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY), list = el && (el.closest(".glist") || (el.closest(".grp") && $(".glist", el.closest(".grp"))));
  document.querySelectorAll(".glist.over").forEach(l => { if (l !== list) l.classList.remove("over"); });
  if (!list) return; list.classList.add("over");
  const kids = [...list.children].filter(c => c !== drag.li); let ref = null;
  for (const k of kids) { const b = k.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { ref = k; break; } }
  if (ref !== drag.li.nextSibling || drag.li.parentNode !== list) list.insertBefore(drag.li, ref);
}, { passive: false });
function endDrag() {
  if (!drag) return;
  if (drag.on) { drag.g.remove(); drag.li.classList.remove("dragging"); document.querySelectorAll(".glist.over").forEach(l => l.classList.remove("over")); updCounts(); }
  drag = null;
}
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

/* ===== CỬA SỔ THIẾT LẬP ===== */
const modal = $("#modal");
function openSet() { $("#fs").value = S.fs; $("#sex").value = S.sex; $("#secs").value = S.secs; $("#fx").value = S.fx; $("#flt").checked = S.filter; modal.classList.add("on"); }
const closeSet = () => modal.classList.remove("on");
$("#gear").onclick = openSet; $("#x").onclick = closeSet; $("#cancel").onclick = closeSet;
modal.addEventListener("pointerdown", e => { if (e.target === modal) closeSet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSet(); });
$("#save").onclick = () => {
  S.sex = $("#sex").value; S.fx = +$("#fx").value; S.fs = +$("#fs").value; applyFs(); S.filter = $("#flt").checked;
  const v = parseInt($("#secs").value, 10); S.secs = v >= 1 ? Math.min(v, 300) : 15;
  saveSet(); closeSet();
};
</script>
