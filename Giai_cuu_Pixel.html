<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hành trình giải cứu Pixel</title>
<style>
:root{--ink:#1d2a44;--soft:#5b6b8c;--red:#e53935;--amber:#f59300;--green:#2e9e5b;--blue:#2f80ed;--card:#fff;--line:#d9e2f2}
*{box-sizing:border-box}
html,body{margin:0}
body{font:20px/1.5 "Segoe UI","Be Vietnam Pro",Roboto,system-ui,sans-serif;color:var(--ink);min-height:var(--vhpx,100vh);
  background:linear-gradient(160deg,#dff3ff 0%,#efe6ff 55%,#ffe9f1 100%);background-attachment:fixed}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px 16px;padding:6px 20px 6px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(6px);border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.team{position:absolute;left:50%;top:0;height:72px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:center;max-width:34vw;text-align:center;font-weight:700;color:var(--soft)}
#keys{margin-left:auto}
.fac{margin-left:16px}
@media (max-width:1500px){header:has(.fac.on) .team{position:static;transform:none;height:auto;max-width:none;flex:1;min-width:140px}header:has(.fac.on) #keys{margin-left:0}}
#keys{display:flex;gap:10px}
.slot{width:84px;text-align:center;font-size:12px;line-height:1.2;color:var(--soft);font-weight:600}
.slot .box{width:48px;height:48px;margin:0 auto 2px;border-radius:16px;border:3px dashed #b9c6e0;background:#f4f7fd;display:grid;place-items:center;font-size:28px;color:#b9c6e0;font-weight:800}
.slot.on .box{border:3px solid #ffb300;background:#fff8e1}
.slot.on{color:var(--ink)}
.slot.pop .box{animation:pop .7s}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
main{max-width:980px;margin:0 auto;padding:22px 18px 70px}
.screen{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:26px;padding:24px 28px;box-shadow:0 8px 28px rgba(60,80,140,.14);margin-bottom:20px}
h1{font-size:34px;line-height:1.2;margin:0 0 8px}
h2{font-size:28px;margin:0 0 6px}
h3{font-size:22px;margin:0 0 12px}
.zone{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:4px 16px;font-size:16px;font-weight:700;margin-bottom:10px}
.narrator{display:flex;gap:16px;align-items:center}
.narrator .say{flex:1;background:#eef5ff;border:2px solid #cfe0fb;border-radius:22px;padding:14px 20px;position:relative}
.pixel{flex:none;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.btn{background:var(--blue);color:#fff;border:0;border-radius:18px;padding:14px 30px;font-weight:800;font-size:22px;box-shadow:0 5px 0 #1d5fbf;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d5fbf}
.btn.green{background:var(--green);box-shadow:0 5px 0 #1f7a43}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.center{text-align:center}
input[type=text]{font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:3px solid var(--line);width:100%;max-width:340px}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.rules{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.rule{flex:1;min-width:170px;border-radius:18px;padding:12px 16px;color:#fff;font-weight:700}
.rule b{display:block;font-size:26px;letter-spacing:1px}
.rule span{font-size:15px;font-weight:600;opacity:.95}
.r-d{background:var(--red)}.r-c{background:var(--amber)}.r-k{background:var(--green)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.act{flex:1;min-width:200px;border:0;border-radius:20px;color:#fff;padding:16px 12px;text-align:center;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
.act b{display:block;font-size:30px}
.act span{font-size:15px;font-weight:600}
.act:hover:not([disabled]){transform:translateY(-3px)}
.act.d{background:var(--red)}.act.c{background:var(--amber)}.act.k{background:var(--green)}
.act[disabled]{opacity:.35;cursor:default;box-shadow:none}
.act.right{opacity:1!important;outline:6px solid #ffd54f}
.fb{margin-top:14px;border-radius:18px;padding:14px 18px;font-weight:600;display:none}
.fb.show{display:block;animation:in .3s}
.fb.hint{background:#fff4e0;border:2px solid #ffcf85}
.fb.good{background:#e6f8ec;border:2px solid #8fd8a8}
.fb.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* chat */
.chat{background:#f3f6fc;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.chat .title{font-weight:800;color:var(--soft);font-size:16px;border-bottom:2px solid var(--line);padding-bottom:6px}
.msg{display:flex;gap:10px;align-items:flex-end;animation:in .35s}
.av{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.bub{background:#fff;border-radius:18px 18px 18px 4px;padding:9px 16px;max-width:560px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.msg .who{font-size:13px;color:var(--soft);font-weight:700;display:block}
.msg.me{justify-content:flex-end}.msg.me .bub{background:#d8ecff;border-radius:18px 18px 4px 18px}
.typing{display:flex;gap:5px;padding:6px 4px}
.typing i{width:9px;height:9px;border-radius:50%;background:#9db0d6;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{transform:translateY(-6px);opacity:.4}}
/* choices */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 18px;text-align:left;font-weight:600;color:var(--ink);transition:.15s}
.opt:hover:not([disabled]){border-color:var(--blue);transform:translateX(4px)}
.opt.sel{border-color:var(--blue);background:#e8f1ff}
.opt.ok{border-color:var(--green);background:#e6f8ec}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.opts.grid{grid-template-columns:1fr}.narrator{flex-direction:column;text-align:center}}
/* phone */
.phone{max-width:430px;margin:0 auto;background:#1d2a44;border-radius:36px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screenph{background:#fff;border-radius:24px;padding:14px 16px 20px}
.sb{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--soft);margin-bottom:10px}
.sender{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.sms{background:#f0f2f7;border-radius:18px;padding:12px 14px;line-height:1.7}
.hot{cursor:pointer;border-radius:8px;padding:1px 3px;transition:.15s;display:inline}
.hot:hover{background:#fff2a8}
.hot.found{background:#ffd9d6;outline:3px solid var(--red);font-weight:800}
.hot.meh{animation:shake .4s}
.sms .ln{display:block;margin:4px 0}
.signs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:#ffe9e7;border:2px solid #f3a9a3;border-radius:14px;padding:8px 14px;font-size:17px;font-weight:600;animation:in .3s}
.count{font-weight:800;font-size:22px;text-align:center;margin:10px 0}
/* photo */
.photo{background:#fff;border-radius:14px;padding:8px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.photo .cap{font-size:16px;font-weight:800;text-align:center;padding-top:4px}
/* reward */
.reward{text-align:center}
.reward .piece{display:inline-block;animation:pop .8s}
.ask{background:#eaf6ff;border:2px dashed #7bb7ef;border-radius:18px;padding:12px 18px;margin:16px auto;max-width:640px;font-weight:700}
.assemble{display:flex;justify-content:center;gap:70px;transition:gap 1s ease .4s;margin:10px 0}
.assemble.joined{gap:0}
.assemble svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.quote{font-size:22px;font-weight:700;max-width:720px;margin:14px auto}
/* gate + modal */
.modal{position:fixed;inset:0;background:rgba(20,30,60,.6);display:none;place-items:center;z-index:50}
.modal.show{display:grid}
.pinbox{background:#fff;border-radius:26px;padding:24px 30px;text-align:center;width:340px;animation:in .3s}
.dots{display:flex;justify-content:center;gap:14px;margin:10px 0 16px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:12px 0;border-radius:14px;border:2px solid var(--line);background:#f4f7fd;font-weight:800;font-size:26px}
.pad button:active{background:#dde8fb}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;font-size:15px}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hop{animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-22px)}}
.pill{display:inline-block;border-radius:999px;color:#fff;font-weight:800;padding:8px 22px;margin:4px;font-size:22px}
.prog{margin-left:10px;font-weight:700;color:var(--soft);font-size:16px}
.prog i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#cbd6ee;margin:0 3px}
.prog i.on{background:var(--blue)}
.jcard{background:#f3f6fc;border:3px solid var(--line);border-radius:22px;padding:22px;text-align:center;min-height:120px;display:grid;place-items:center;margin:10px 0 16px;font-weight:700}
.popup{max-width:420px;margin:10px auto;border:4px solid var(--red);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.popup .ph{background:var(--red);color:#fff;font-weight:800;padding:6px 12px;display:flex;justify-content:space-between}
.popup .pb{background:#fffbe6;padding:16px;text-align:center;font-weight:800;font-size:24px}
.popup .fk{display:inline-block;margin-top:10px;background:var(--green);color:#fff;border-radius:10px;padding:8px 24px}
.prof{text-align:center}.prof .av{margin:0 auto 6px;width:64px;height:64px;font-size:36px}
.mono{font-family:Consolas,"Courier New",monospace;font-size:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qn{font-weight:800;font-size:20px;color:var(--blue)}
.bar{height:12px;background:#e3eaf7;border-radius:999px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4fc3f7,#2f80ed);border-radius:999px;transition:width .5s}
.gtitle{display:inline-block;font-size:26px;font-weight:800;margin-bottom:8px}
.qbody{margin-top:10px}
.welcome{position:relative;overflow:hidden;padding:34px 28px 40px;background:linear-gradient(135deg,#fff 0%,#eaf4ff 50%,#fff3e0 100%);animation:in .6s}
.wl-emoji{font-size:84px;animation:wpop 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes wpop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.wl-sub{font-size:22px;font-weight:700;color:var(--soft);animation:in .8s .3s both}
.wl-tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:4px 20px;font-weight:800;font-size:20px;margin:8px 0;animation:in .8s .5s both}
.wl-title{font-size:48px;margin:4px 0 6px;background:linear-gradient(90deg,#2f80ed,#ab47bc,#f59300);-webkit-background-clip:text;background-clip:text;color:transparent;animation:wzoom .9s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes wzoom{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.wl-text{font-size:22px;font-weight:600;max-width:640px;margin:8px auto 22px;animation:in .8s 1s both}
.welcome .btn{animation:in .6s 1.4s both}
.spk{position:absolute;font-size:24px;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3) rotate(20deg)}}
.trk{position:relative;height:38px;margin:2px 18px 0}
.trk-bg{position:absolute;left:0;right:0;top:15px;height:8px;border-radius:4px;background:#e3eaf7}
.trk-fill{position:absolute;left:0;top:15px;height:8px;border-radius:4px;background:linear-gradient(90deg,#4fc3f7,#2f80ed);transition:width .7s}
.ms{position:absolute;top:9px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:3px solid #b9c6e0;display:grid;place-items:center;font-size:11px;line-height:1;font-weight:800;color:#fff;transition:.4s}
.ms.done{background:var(--green);border-color:var(--green)}
.pxr{position:absolute;top:-1px;left:0;transform:translateX(-50%);transition:left .7s;z-index:2}
.pxr .pixel{display:block;animation:none}
.trk-lab{display:flex;margin:0 18px;font-size:13px;font-weight:700;color:var(--soft)}
.trk-lab span{text-align:center}
.trk-lab .cur{color:var(--blue)}.trk-lab .dn{color:var(--green)}
.gear{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;line-height:1;padding:0;opacity:.5}
.gear:hover{opacity:1}.gear.on{background:var(--blue);border-color:var(--blue);opacity:1}
.fac{display:none;align-items:center;gap:8px}.fac.on{display:flex}
.ftag{background:#fff4e0;color:#8a5200;border:2px solid #ffcf85;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.fbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px;font-weight:800;font-size:16px;color:var(--ink)}
.fbtn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.fbtn[disabled]{opacity:.35;cursor:not-allowed}
.fview{font-size:13px;font-weight:700;color:#8a5200;display:none}
#stage.past{pointer-events:none}
.keyfloat{animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
main:has(.rescue){max-width:1280px}
.rescue{position:relative;overflow:hidden;background:none;box-shadow:none;color:var(--ink);text-align:center;padding:18px 10px 24px;min-height:560px}
.fwcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rs-in{position:relative;z-index:1}
.rs-sub{font-size:22px;font-weight:800;color:#b86e00}
.rs-title{font-size:52px;margin:4px 0 6px;animation:wzoom .9s cubic-bezier(.2,1.4,.4,1) both}
.rs-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin:6px 0 10px}
.rs-side{display:flex;flex-direction:column;gap:14px}
.rs-side.left{align-items:flex-end}.rs-side.right{align-items:flex-start}
.sk{display:flex;align-items:center;gap:10px;border-radius:18px;padding:12px 18px;font-weight:800;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:skinL .8s .5s both}
.right .sk{animation-name:skinR}.left .sk:nth-child(2),.right .sk:nth-child(2){animation-delay:.8s}
@keyframes skinL{from{opacity:0;transform:translateX(-60px)}}
@keyframes skinR{from{opacity:0;transform:translateX(60px)}}
.sk.t1{background:#c8f3e0;color:#085041}.sk.t2{background:#ffe7b8;color:#633806}.sk.t3{background:#e0dcff;color:#3c3489}.sk.t4{background:#ffd6e6;color:#72243e}
.dance{animation:dance 1.1s ease-in-out infinite}
.dance .pixel{animation:none;filter:drop-shadow(0 0 22px rgba(255,193,7,.7))}
.rs-sks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 4px}
.rs-sks .sk{padding:8px 16px;font-size:18px;box-shadow:none;animation:in .8s .5s both}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-7deg)}25%{transform:translateY(-28px) rotate(7deg)}50%{transform:translateY(0) rotate(-7deg)}75%{transform:translateY(-28px) rotate(7deg)}}
.rs-quote{font-size:30px;font-weight:800;max-width:780px;margin:16px auto 12px;line-height:1.35;animation:in 1s 1.1s both}
.rs-thanks{color:var(--soft);font-weight:700;margin:12px 0 0}
@media (max-width:760px){.rs-grid{grid-template-columns:1fr}.rs-side.left,.rs-side.right{align-items:center}.rs-title{font-size:32px}.rs-quote{font-size:24px}}
.mbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:3px solid var(--line);border-radius:14px;padding:8px 12px;max-width:560px;background:#fff;min-height:54px}
.mbox:focus-within{border-color:var(--blue)}
.mbox #chips{display:contents}
.mbox input[type=text]{border:0;outline:0;font:inherit;font-weight:700;flex:1;min-width:150px;width:auto;max-width:none;padding:4px}
.mchip{display:inline-flex;align-items:center;gap:6px;background:#e6f1fb;color:#0c447c;border-radius:999px;padding:4px 6px 4px 14px;font-weight:800;font-size:19px}
.mchip button{border:0;background:#cfe3f8;color:#0c447c;width:26px;height:26px;border-radius:50%;font-weight:800;line-height:1;padding:0}
.mchip button:hover{background:#f4b6b3;color:#7a1414}
.mhint{color:var(--soft);font-size:15px;margin:6px 0 0}.merr{color:var(--red);font-weight:700;min-height:24px;margin:4px 0 0}
.tm{font-size:13px;font-weight:600;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span id="hpix"></span><span>Giải cứu Pixel</span></div>
  <div class="team" id="teamName"></div>
  <div class="fac" id="fac"><span class="ftag">Chế độ hỗ trợ viên</span>
    <button class="fbtn" id="fback">◀ Quay lại</button><span class="fview" id="fview">Đang xem lại</span>
    <button class="fbtn p" id="fnext">Tiếp theo ▶</button></div>
  <div id="keys"></div>
  <button class="gear" id="gear" aria-label="Cài đặt" title="Cài đặt">⚙️</button>
  <div id="prog" style="flex-basis:100%;display:none"></div>
</header>
<main id="stage"></main>

<div class="modal" id="pinModal">
  <div class="pinbox" id="pinBox">
    <h3>🔐 Dành cho hỗ trợ viên</h3>
    <div id="pinSub" style="font-size:15px;color:var(--soft);font-weight:600"></div>
    <div class="dots" id="pinDots"></div>
    <div id="pinMsg" style="min-height:26px;font-weight:700;color:var(--red);font-size:16px"></div>
    <div class="pad" id="pinPad"></div>
    <p><button class="link" id="pinCancel">Đóng</button></p>
  </div>
</div>

<script>
/* ===== CẤU HÌNH ===== */
const PIN = "2026";   // Mã 4 số của hỗ trợ viên để bấm "Mở cổng". Có thể đổi tại đây.

/* ===== TIỆN ÍCH ===== */
const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage");
const state = { team: "", members: [], keys: [false, false, false], hd: [false, false, false], q: 0 };
const SKILLS = ["Biết từ chối", "Biết nhận ra lừa đảo", "Biết giúp bạn"];
const KCOL = ["#ff7043", "#ffca28", "#66bb6a"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));

let AC;
function tone(list) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    list.forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .22);
      o.start(t); o.stop(t + .24); t += .15;
    });
  } catch (e) {}
}
const good = () => tone([660, 880, 1100]);
const soft = () => tone([330, 280]);

/* ===== HÌNH VẼ ===== */
function pixel(mood = "happy", size = 110, cage = false) {
  const eyes = {
    happy: '<circle cx="44" cy="58" r="8" fill="#1d2a44"/><circle cx="76" cy="58" r="8" fill="#1d2a44"/><circle cx="47" cy="55" r="3" fill="#fff"/><circle cx="79" cy="55" r="3" fill="#fff"/>',

/* Lịch sử màn hình để hỗ trợ viên lật nhanh: giữ nguyên từng màn (kể cả trạng thái đã làm) */
const nav = { hist: [], i: -1 };
function screen(html) {
  const d = document.createElement("div");
  d.className = "screen"; d.innerHTML = html;
  nav.hist.push({ el: d, skip: null, prog: null }); showEntry(nav.hist.length - 1);
  return d;
}
function showEntry(i) {
  nav.i = i; const e = nav.hist[i];
  stage.innerHTML = ""; stage.appendChild(e.el); stage.classList.toggle("past", i < nav.hist.length - 1);
  window.scrollTo(0, 0);
  if (e.prog) drawProg(e.prog.n, e.prog.zi, e.prog.hidden); else $("#prog").style.display = "none";
  updateNavUI();
}
function setSkip(f) { nav.hist[nav.hist.length - 1].skip = f; updateNavUI(); }
function updateNavUI() {
  const past = nav.i < nav.hist.length - 1, e = nav.hist[nav.i];
  $("#fback").disabled = nav.i <= 0;
  $("#fnext").disabled = !(past || (e && e.skip));
  $("#fview").style.display = past ? "inline" : "none";
}
function facNext() {
  if (nav.i < nav.hist.length - 1) { showEntry(nav.i + 1); return; }
  const e = nav.hist[nav.i]; if (e && e.skip) e.skip();
}
function facBack() { if (nav.i > 0) showEntry(nav.i - 1); }
function setFac(on) {
  $("#fac").classList.toggle("on", on); $("#gear").classList.toggle("on", on);
  if (!on && nav.i < nav.hist.length - 1) showEntry(nav.hist.length - 1);
}
$("#fnext").onclick = facNext; $("#fback").onclick = facBack;
$("#gear").onclick = () => { if ($("#fac").classList.contains("on")) setFac(false); else openPin(() => setFac(true), "Nhập mật khẩu để mở chế độ lật trang"); };
document.addEventListener("keydown", e => {
  if (!$("#fac").classList.contains("on") || $("#pinModal").classList.contains("show") || (document.activeElement && document.activeElement.tagName === "INPUT")) return;
  if (e.key === "ArrowRight") facNext(); else if (e.key === "ArrowLeft") facBack();
});
function append(parent, html) {
  const d = document.createElement("div");
  d.className = "card screen"; d.innerHTML = html; parent.appendChild(d);
  setTimeout(() => d.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  return d;
}
function say(fb, type, text) {
  fb.className = "fb show " + type; fb.innerHTML = text;
  if (type === "hint") { void fb.offsetWidth; fb.classList.add("shake"); }
  setTimeout(() => fb.scrollIntoView({ behavior: "smooth", block: "nearest" }), 60);
}

/* Khối chọn DỪNG – CHẶN – KỂ (cfg.inline: chèn thẳng vào khung câu hỏi; cfg.label: chữ trên nút tiếp tục) */
function actionBlock(parent, cfg) {
  const html = `<h3 style="margin-top:14px">Cả đội thảo luận: bước đầu tiên là gì?</h3>
    <div class="acts">
      <button class="act d" data-k="d"><b>🛑 DỪNG</b><span>không trả lời, không bấm</span></button>
      <button class="act c" data-k="c"><b>🚫 CHẶN</b><span>chặn và báo cáo</span></button>
      <button class="act k" data-k="k"><b>🗣️ KỂ</b><span>nói với người lớn tin cậy</span></button>
    </div><div class="fb"></div>`;
  let b;
  if (cfg.inline) { b = document.createElement("div"); b.innerHTML = html; parent.appendChild(b); }
  else b = append(parent, html);
  const fb = $(".fb", b);
  b.querySelectorAll(".act").forEach(btn => btn.onclick = () => {
    const k = btn.dataset.k;
    if (k === cfg.correct) {
      good();
      b.querySelectorAll(".act").forEach(x => { x.disabled = true; if (x === btn) x.classList.add("right"); });
      say(fb, "good", cfg.fb[k] + '<div class="center" style="margin-top:12px"><button class="btn green" id="go">' + (cfg.label || "Tiếp tục ▶") + '</button></div>');
      $("#go", fb).onclick = () => { $("#go", fb).remove(); cfg.next(); };
    } else { soft(); say(fb, "hint", cfg.fb[k]); }
  });
}

function intro() {
  state.keys = [false, false, false]; state.hd = [false, false, false]; renderKeys(); state.team = ""; state.members = []; renderTeam();
  const s = screen(`<div class="card">
    ${narrator("worried", `<h1>Hành trình giải cứu Pixel</h1>Pixel, chú robot nhỏ, bị lạc trong <b>Mê cung mạng</b>! Để giải cứu Pixel, đội mình sẽ đi qua <b>3 vùng</b>, mỗi vùng nhận <b>1 mảnh chìa khóa</b>. Ghép đủ 3 mảnh thành chìa khóa để mở cổng cuối.`, true)}
    <h3 style="margin-top:20px">Ba bí quyết tự bảo vệ</h3>
    <div class="rules">
      <div class="rule r-d"><b>🛑 DỪNG</b><span>Không trả lời, không bấm</span></div>
      <div class="rule r-c"><b>🚫 CHẶN</b><span>Chặn và báo cáo</span></div>
      <div class="rule r-k"><b>🗣️ KỂ</b><span>Nói với người lớn tin cậy</span></div>
    </div>
    <h3 style="margin-top:22px">Đội mình tên là gì?</h3>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="font-size:24px">Biệt đội</b><input type="text" id="tn" maxlength="24" placeholder="Ví dụ: Sao Sáng" autocomplete="off"></div>
    <h3 style="margin-top:22px">Nhập tên thành viên</h3>
    <div class="mbox"><span id="chips"></span><input type="text" id="mi" maxlength="14" placeholder="Gõ tên từng bạn rồi bấm Enter" autocomplete="off"></div>
    <p class="mhint" id="mh"></p><p class="merr" id="me"></p>
    <p class="center" style="margin-top:14px"><button class="btn" id="st">Bắt đầu (Xem hướng dẫn) ▶</button></p></div>`);
  let members = [];
  const mi = $("#mi", s);
  const drawChips = () => {
    $("#chips", s).innerHTML = members.map((m, i) => `<span class="mchip">${esc(m)}<button data-i="${i}" aria-label="Xóa ${esc(m)}">✕</button></span>`).join("");
    const full = members.length >= 3; mi.style.display = full ? "none" : "";
    mi.placeholder = members.length ? "Thêm tên…" : "Gõ tên từng bạn rồi bấm Enter";
    $("#mh", s).textContent = full ? "Đã đủ 3 bạn. Bấm ✕ nếu muốn đổi tên." : "Mỗi tên là một thẻ, bấm ✕ để xóa. Tối đa 3 bạn.";
  };
  const addName = raw => {
    raw.split(",").map(x => x.trim()).filter(Boolean).forEach(n => { if (members.length < 3) members.push(n); });
    mi.value = ""; $("#me", s).textContent = ""; drawChips();
  };
  const finish = () => {
    const n = $("#tn", s).value.trim().replace(/^biệt\s*đội\s*/i, "");
    state.team = n || "Bí Ẩn"; state.members = members.slice(); renderTeam(); tutorial();
  };
  const go = () => {
    if (mi.value.trim()) addName(mi.value);
    if (!members.length) {
      const me = $("#me", s); me.textContent = "Nhập ít nhất 1 tên thành viên nhé!";
      const bx = $(".mbox", s); bx.style.animation = "none"; void bx.offsetWidth; bx.style.animation = "shake .4s"; mi.focus(); soft(); return;
    }
    finish();
  };
  $("#st", s).onclick = go; setSkip(finish);
  $("#chips", s).onclick = e => { const bt = e.target.closest("button"); if (!bt) return; members.splice(+bt.dataset.i, 1); drawChips(); mi.focus(); };
  mi.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      if (mi.value.trim()) addName(mi.value); else if (e.key === "Enter" && members.length) go();
    } else if (e.key === "Backspace" && !mi.value && members.length) { members.pop(); drawChips(); }
  });
  mi.addEventListener("input", () => { if (mi.value.includes(",")) addName(mi.value); });
  mi.addEventListener("blur", () => { if (mi.value.trim()) addName(mi.value); });
  $("#tn", s).addEventListener("keydown", e => { if (e.key === "Enter") mi.focus(); });
  drawChips();
}

/* ===== TIỆN ÍCH CHO CÂU HỎI ===== */
const msgHtml = m => `<div class="msg"><div class="av">${m.av}</div><div class="bub"><span class="who">${esc(m.who)}</span>${m.html}</div></div>`;
async function playChat(box, msgs) {

    const t = document.createElement("div"); t.className = "msg";

function nextBtn(label) { return `<div class="center" style="margin-top:12px"><button class="btn green" id="nx2">${label}</button></div>`; }
/* Nút cuối câu: nếu còn câu tiếp trong trò chơi thì "Câu tiếp", nếu là câu cuối trò chơi thì "Trò chơi tiếp theo" */
const tail = (ctx, after) => after ? { label: "Câu tiếp ▶", fn: after } : { label: ctx.endLabel, fn: ctx.next };

/* Mỗi câu hỏi là một màn hình mới, kèm thanh tiến độ */
function qScreen(ctx) {
  const intro = ctx.intro && !ctx.introUsed ? ctx.intro : ""; ctx.introUsed = true;
  const s = screen(`<div class="card"><span class="gtitle">${ctx.title}</span>${intro}<div class="qbody"></div></div>`);
  if (ctx.hidden) setProg(0, ctx.zi, true); else setProg(++state.q, ctx.zi, false);
  return $(".qbody", s);
}
/* Thanh tiến độ kiểu B: thanh liền, cột mốc tròn, Pixel chạy trên đường */
function initProg() {
  const labs = ZONES.map((Z, i) => `<span id="pl${i}" style="flex:${Z.total}">Vùng ${i + 1}</span>`).join("");
  const ms = ZONES.map((Z, i) => `<div class="ms" id="ms${i}" style="left:${(Z.start + Z.total) / TOTAL * 100}%">${i === ZONES.length - 1 ? "🔑" : ""}</div>`).join("");
  $("#prog").innerHTML = `<div id="pq"><div class="qtop" style="margin:0"><span class="zone" id="pz" style="margin:0"></span><span class="qn" id="pn"></span></div>
    <div class="trk"><div class="trk-bg"></div><div class="trk-fill" id="pf"></div>${ms}<div class="pxr" id="pxr">${pixel("happy", 34)}</div></div>
    <div class="trk-lab">${labs}</div></div>
    <div id="ph" style="display:none"><span class="zone" id="phz" style="background:#8e44ad;margin:0"></span></div>`;
}
function setProg(n, zi, hidden) {
  nav.hist[nav.hist.length - 1].prog = { n, zi, hidden }; drawProg(n, zi, hidden);
}
function drawProg(n, zi, hidden) {
  const Z = ZONES[zi], pg = $("#prog"); pg.style.display = "block";
  $("#pq").style.display = hidden ? "none" : "block"; $("#ph").style.display = hidden ? "block" : "none";
  if (hidden) { $("#phz").textContent = "⭐ Thử thách ẩn · " + Z.name; return; }
  const pc = n / TOTAL * 100;
  $("#pz").textContent = Z.name; $("#pn").textContent = `Câu ${n}/${TOTAL}`;
  $("#pf").style.width = pc + "%"; $("#pxr").style.left = pc + "%";
  ZONES.forEach((z, i) => {
    const done = n > z.start + z.total, cur = i === zi;
    const m = $("#ms" + i); if (i < ZONES.length - 1) { m.classList.toggle("done", done); m.textContent = done ? "✔" : ""; }
    $("#pl" + i).className = done ? "dn" : (cur ? "cur" : "");
  });
}

/* Dựng khối chọn 1 đáp án vào box; gọi onCorrect(o, fb) khi chọn đúng */
function buildPick(box, R, onCorrect) {
  const w = document.createElement("div");
  w.innerHTML = `<h3>${R.q}</h3>${R.scene || ""}<div class="opts ${R.grid ? "grid" : ""}" style="margin-top:12px"></div><div class="fb"></div>`;
  box.appendChild(w);
  const ob = $(".opts", w), fb = $(".fb", w);
  shuffle(R.o).forEach(o => {
    const bt = document.createElement("button"); bt.className = "opt" + (R.mono ? " mono" : ""); bt.innerHTML = o.t; ob.appendChild(bt);
    bt.onclick = () => {
      if (!o.ok) { soft(); say(fb, "hint", o.h); return; }
      good(); ob.querySelectorAll(".opt").forEach(x => x.disabled = true); bt.classList.add("ok");
      onCorrect(o, fb);
    };
  });
}

function pickRounds(ctx, rounds, after) {
  let r = 0;
  const show = () => {
    const R = rounds[r++], lastR = r === rounds.length, box = qScreen(ctx);
    setSkip(lastR ? tail(ctx, after).fn : show);
    buildPick(box, R, (o, fb) => {
      const t = lastR ? tail(ctx, after) : { label: "Câu tiếp ▶", fn: show };
      say(fb, "good", R.g + nextBtn(t.label)); $("#nx2", fb).onclick = t.fn;
    });
  };
  show();
}

function multiPick(ctx, cfg, after) {
  const box = qScreen(ctx); setSkip(tail(ctx, after).fn);
  box.innerHTML = `<h3>${cfg.q}</h3><div class="opts grid"></div><div class="fb"></div>
    <p class="center" style="margin:16px 0 0"><button class="btn" id="chk">Xong rồi! ✔</button></p>`;
  const ob = $(".opts", box), fb = $(".fb", box);
  const O = cfg.o.map(x => Object.assign({}, x));
  shuffle(O).forEach(o => {
    const bt = document.createElement("button"); bt.className = "opt"; bt.innerHTML = o.t; o.el = bt;
    bt.onclick = () => bt.classList.toggle("sel"); ob.appendChild(bt);
  });
  $("#chk", box).onclick = () => {
    const wrong = O.filter(o => !o.ok && o.el.classList.contains("sel"));
    const right = O.filter(o => o.ok && o.el.classList.contains("sel"));
    if (wrong.length) {
      soft(); wrong.forEach(o => o.el.classList.remove("sel"));
      say(fb, "hint", wrong.map(o => "• " + o.h).join("<br>") + "<br>Mình bỏ ra và chọn lại nhé!");
    } else if (right.length < cfg.need) {
      soft(); say(fb, "hint", `Đúng hướng rồi! Nhưng cần chọn đủ ${cfg.need} ý. Đội mình chọn thêm nhé!`);
    } else {
      const t = tail(ctx, after);
      const cb = $("#chk", box); if (cb) cb.parentNode.remove(); ob.querySelectorAll(".opt").forEach(x => { x.disabled = true; });
      O.filter(o => o.ok).forEach(o => o.el.classList.add("ok")); good();
      say(fb, "good", cfg.g + nextBtn(t.label)); $("#nx2", fb).onclick = t.fn;
    }
  };
}

/* Thẻ lần lượt, mỗi thẻ là một câu */
function cardsJudge(ctx, items, L, after) {
  const list = shuffle(items); let k = 0;
  const render = () => {
    const it = list[k], isLast = k + 1 === list.length, box = qScreen(ctx);
    setSkip(isLast ? tail(ctx, after).fn : () => { k++; render(); });
    box.innerHTML = `<div class="jcard">${it.h}</div><div class="acts"></div><div class="fb"></div>`;
    const ac = $(".acts", box), fb = $(".fb", box);
    ac.innerHTML = L.map((l, j) => `<button class="act ${l.c}" data-j="${j}"><b>${l.t}</b></button>`).join("");
    ac.querySelectorAll(".act").forEach(bt => bt.onclick = () => {
      if (+bt.dataset.j !== it.a) { soft(); say(fb, "hint", it.hint || "Chưa đúng, nhìn kỹ lại và thảo luận với đội nhé!"); return; }
      good(); ac.querySelectorAll(".act").forEach(x => x.disabled = true); bt.classList.add("right");
      const t = isLast ? tail(ctx, after) : { label: "Câu tiếp ▶", fn: () => { k++; render(); } };
      say(fb, "good", it.why + nextBtn(t.label)); $("#nx2", fb).onclick = t.fn;
    });
  };

}

/* Chat nhiều tình huống: màn chat (kèm bước DỪNG/CHẶN/KỂ nếu có), rồi màn chọn câu trả lời */
function chatRounds(ctx, rounds) {
  let k = 0;
  const chatScreen = async (R, animate, skipFn) => {
    const box = qScreen(ctx); setSkip(skipFn);
    box.innerHTML = `<div class="chat"><div class="title">${R.title}</div></div>`;
    const chat = $(".chat", box);
    if (animate) await playChat(chat, R.msgs); else chat.insertAdjacentHTML("beforeend", R.msgs.map(msgHtml).join(""));
    return { box, chat };
  };
  const round = async () => {
    const R = rounds[k++], lastRound = k === rounds.length;
    const t = lastRound ? { label: ctx.endLabel, fn: ctx.next } : { label: "Câu tiếp ▶", fn: round };
    const pick = (box, chat) => buildPick(box, R, (o, fb) => {
      chat.insertAdjacentHTML("beforeend", `<div class="msg me"><div class="bub">${o.t}</div></div><div class="msg"><div class="av">${R.reply[0]}</div><div class="bub"><span class="who">${esc(R.reply[1])}</span>${R.reply[2]}</div></div>`);
      say(fb, "good", R.g + nextBtn(t.label)); $("#nx2", fb).onclick = t.fn;
    });
    const toPick = async () => { const s2 = await chatScreen(R, false, t.fn); pick(s2.box, s2.chat); };
    const first = await chatScreen(R, true, R.action ? toPick : t.fn);
    if (R.action) actionBlock(first.box, Object.assign({}, R.action, { inline: 1, label: "Câu tiếp ▶", next: toPick }));
    else pick(first.box, first.chat);
  };
  round();
}

/* Soi dấu hiệu lừa đảo trên tin nhắn, mỗi tin là một câu */
function spotSigns(ctx, scenes, after) {
  let k = 0;
  const show = () => {
    const S = scenes[k++], isLast = k === scenes.length, box = qScreen(ctx);
    setSkip(isLast ? tail(ctx, after).fn : show);
    const need = S.lines.filter(l => l.info).length;
    const lines = S.lines.map((l, j) => `<span class="ln"><span class="hot" ${l.info ? `data-i="${j}"` : 'data-d="1"'}>${l.t}</span></span>`).join("");
    box.innerHTML = `<h3>Chạm vào ${need} dấu hiệu lừa đảo trên tin nhắn này!</h3>
      <div class="phone" style="margin-top:12px"><div class="screenph"><div class="sb"><span class="hot" data-d="1">10:05</span><span class="hot" data-d="1">🔋 80%</span></div>
      <div class="sender">${S.sender}</div><div class="sms">${lines}</div></div></div>
      <div class="count">Đã tìm: <span class="c">0</span> / ${need}</div><div class="signs"></div><div class="fb"></div>`;
    let found = 0; const fb = $(".fb", box);
    box.querySelectorAll(".hot").forEach(h => h.onclick = () => {
      if (h.dataset.d) { soft(); h.classList.remove("meh"); void h.offsetWidth; h.classList.add("meh"); say(fb, "hint", "Chỗ này bình thường thôi. Tìm chỗ đáng ngờ hơn nhé!"); return; }
      if (h.classList.contains("found")) return;
      h.classList.add("found"); found++; good(); fb.className = "fb";
      const c = document.createElement("div"); c.className = "chip"; c.textContent = "🚩 " + S.lines[h.dataset.i].info; $(".signs", box).appendChild(c);
      $(".c", box).textContent = found;
      if (found === need) {
        const t = isLast ? tail(ctx, after) : { label: "Câu tiếp ▶", fn: show };
        box.querySelectorAll(".hot").forEach(x => x.style.pointerEvents = "none");
        say(fb, "good", "Tìm đủ rồi, giỏi quá! Gặp tin như vậy thì DỪNG, CHẶN và KỂ." + nextBtn(t.label));
        $("#nx2", fb).onclick = t.fn;
      }
    });
  };
  show();
}

/* Truyện rẽ nhánh: nút `q:1` đánh dấu nút quyết định, tính là một câu */
function story(ctx, N, start) {
  const visited = new Set(); let box;
  const go = id => {
    const n = N[id];
    if (n.q && !visited.has(id)) { visited.add(id); box = qScreen(ctx); setSkip(n.skipTo ? () => go(n.skipTo) : ctx.next); }
    box.innerHTML = `<div class="narrator">${pixel(n.end ? "joy" : (n.back ? "worried" : "happy"), 84)}<div class="say">${n.text}</div></div><div class="opts" style="margin-top:14px"></div>`;
    const o = $(".opts", box);
    if (n.end) { good(); o.innerHTML = `<div class="center"><button class="btn green" id="se">${ctx.endLabel}</button></div>`; $("#se", box).onclick = ctx.next; return; }
    if (n.back) { soft(); o.innerHTML = '<div class="center"><button class="btn" id="sb">↩ Quay lại chọn lại</button></div>'; $("#sb", box).onclick = () => go(n.back); return; }
    shuffle(n.opts).forEach(x => { const bt = document.createElement("button"); bt.className = "opt"; bt.textContent = x.t; bt.onclick = () => go(x.to); o.appendChild(bt); });
  };
  go(start);
}

function confetti() {
  const cols = ["#ff7043", "#ffca28", "#66bb6a", "#42a5f5", "#ab47bc", "#ef5350"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div"); c.className = "conf";
    c.style.left = Math.random() * 100 + "vw"; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s"; c.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 7000);
  }
}
function fireworks(card, cv) {
  const c2 = cv.getContext("2d"), cols = ["#ff7043", "#ffb300", "#66bb6a", "#42a5f5", "#ab47bc", "#ef5350"];
  let parts = [], nextB = 0;
  const burst = (x, y) => {
    const c = cols[Math.floor(Math.random() * cols.length)], n = 38;
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, s = 2 + Math.random() * 2.2; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, a: 1, c }); }
  };
  const loop = ts => {
    if (!card.isConnected) { setTimeout(() => requestAnimationFrame(loop), 400); return; }
    const w = card.clientWidth, h = card.clientHeight;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    c2.clearRect(0, 0, w, h);
    if (ts > nextB) { nextB = ts + 450 + Math.random() * 500; burst(w * (0.08 + Math.random() * 0.84), h * (0.1 + Math.random() * 0.5)); }
    parts = parts.filter(p => p.a > 0.02);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.99; p.a -= 0.012; c2.globalAlpha = p.a; c2.fillStyle = p.c; c2.beginPath(); c2.arc(p.x, p.y, 2.5, 0, 7); c2.fill(); });
    c2.globalAlpha = 1; requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function downloadCert() {
  const W = 1754, H = 1240, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), ff = getComputedStyle(document.body).fontFamily;
  const txt = (s, x, y, size, color, w = 700, al = "center") => { g.font = `${w} ${size}px ${ff}`; g.fillStyle = color; g.textAlign = al; g.fillText(s, x, y); };
  g.fillStyle = "#fffdf6"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "#ba7517"; g.lineWidth = 12; g.strokeRect(50, 50, W - 100, H - 100);
  g.lineWidth = 3; g.strokeRect(78, 78, W - 156, H - 156);
  txt("TEACHERS FOR LIFE 2026", W / 2, 170, 34, "#5f5e5a");
  txt("KẾT NỐI YÊU THƯƠNG – CÙNG NHAU AN TOÀN", W / 2, 218, 30, "#5f5e5a", 600);
  txt("GIẤY CHỨNG NHẬN", W / 2, 340, 100, "#854f0b", 800);
  txt("Biệt đội", W / 2, 420, 38, "#5f5e5a", 600);
  let size = 96; g.font = `800 ${size}px ${ff}`;
  while (g.measureText(state.team).width > W - 500 && size > 44) { size -= 4; g.font = `800 ${size}px ${ff}`; }
  txt(state.team, W / 2, 555, size, "#185fa5", 800);
  if (state.members.length) txt(state.members.join("  ·  "), W / 2, 640, 42, "#1d2a44", 700);
  txt("Đã hoàn thành Hành trình giải cứu Pixel", W / 2, 730, 46, "#1d2a44", 600);
  txt("và nắm vững 3 bí quyết tự bảo vệ trên mạng", W / 2, 795, 46, "#1d2a44", 600);
  [["DỪNG", "#e24b4a"], ["CHẶN", "#ba7517"], ["KỂ", "#3b6d11"]].forEach(([s, col], i) => {
    const x = W / 2 + (i - 1) * 250, y = 860; g.fillStyle = col; g.beginPath(); g.roundRect(x - 105, y, 210, 72, 36); g.fill();
    txt(s, x, y + 51, 38, "#fff", 800);
  });
  const d = new Date(), ds = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  txt("Ngày " + ds, 190, 1090, 34, "#5f5e5a", 600, "left");
  txt("Lớp 5A12", W - 190, 1090, 34, "#5f5e5a", 600, "right");
  const save = () => c.toBlob(b => {
    const a = document.createElement("a"), nm = state.team.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "doi";
    a.href = URL.createObjectURL(b); a.download = "Giay_chung_nhan_" + nm + ".png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  Promise.all([
    load("data:image/svg+xml;charset=utf-8," + encodeURIComponent(pixel("joy", 180).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '))),
    load(LOGO)
  ]).then(([px, lg]) => {
    if (px) g.drawImage(px, W / 2 - 90, 960, 180, 180);
    if (lg) g.drawImage(lg, 120, 112, 380, 380 * lg.height / lg.width);
    save();
  });
}

/* ===== TỰ ĐƯA VỀ TỈ LỆ 100% khi trình duyệt đang zoom ===== */
function fitZoom() {
  const ratio = window.outerWidth / window.innerWidth;
  let z = 1;
  [0.5, 0.67, 0.75, 0.8, 0.9, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3].forEach(l => { if (Math.abs(ratio - l) / l < 0.04) z = l; });
  const root = document.documentElement;
  root.style.zoom = z === 1 ? "" : String(1 / z);
  root.style.setProperty("--vhpx", z === 1 ? "100vh" : Math.round(window.innerHeight * z) + "px");
}
fitZoom(); window.addEventListener("resize", fitZoom);

    renderTeam(); renderKeys(); jump[1]();
  } else { intro(); }
})();
</script>
